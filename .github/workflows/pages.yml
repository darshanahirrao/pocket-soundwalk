name: Verify and publish soundwalk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ffmpeg
      - run: mkdir -p artifacts
      - run: ffmpeg -hide_banner -loglevel error -i public/assets/garden.wav -f f32le artifacts/garden.f32
      - run: npm run check:model
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: actual-model-smoke-evidence
          path: artifacts/model-feasibility.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public static app
        id: deployment
        uses: actions/deploy-pages@v4
